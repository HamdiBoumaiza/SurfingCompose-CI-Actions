name: Checkout and set java version
description: Sets up Java
runs:
  using: "composite"
  steps:
    - name: use JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    - name: Configure runner Android SDK
      shell: bash
      run: printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
