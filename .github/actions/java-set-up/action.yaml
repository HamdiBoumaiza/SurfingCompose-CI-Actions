name: Set up Java and Android SDK
description: Sets up Java and the Android SDK tools required by CI
runs:
  using: "composite"
  steps:
    - name: use JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle
    - name: Set up Android SDK
      uses: android-actions/setup-android@v4
    - name: Install required Android SDK packages
      shell: bash
      run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
    - name: Configure runner Android SDK
      shell: bash
      run: printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
