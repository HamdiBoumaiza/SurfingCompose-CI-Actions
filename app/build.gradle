import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.dagger.hilt.android'
    id 'com.google.devtools.ksp'
    id 'org.jetbrains.kotlin.plugin.parcelize'
}

String getApiKey() {
    def apiKey = System.getenv('RAPID_API_KEY')
    def propFile = rootProject.file("./local.properties")
    def properties = new Properties()
    if (apiKey == null && propFile.exists()) {
        propFile.withInputStream { properties.load(it) }
        apiKey = properties.getProperty('RAPID_API_KEY', '').trim()
        // Keep supporting the quoted values used by existing local.properties files.
        if (apiKey.length() >= 2 && apiKey.startsWith('"') && apiKey.endsWith('"')) {
            apiKey = apiKey.substring(1, apiKey.length() - 1)
        }
    }
    return groovy.json.JsonOutput.toJson(apiKey ?: '')
}

android {
    namespace = 'com.hb.surfingcompose'
    compileSdk = 37

    defaultConfig {
        applicationId = "com.hb.surfingcompose"
        minSdk = 24
        targetSdk = 37
        versionCode = 1
        versionName = "1.0"

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary = true
        }

        buildConfigField "String", "RAPID_API_KEY", getApiKey()

    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
